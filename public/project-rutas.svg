<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <circle cx="730" cy="-10" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="70" cy="310" r="170" fill="rgba(255,255,255,0.04)"/>

  <!-- Map grid background -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="220" x2="800" y2="220" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Route path connecting stops -->
  <polyline
    points="140,210 240,120 370,180 500,90 640,160"
    fill="none"
    stroke="rgba(251,191,36,0.6)"
    stroke-width="3"
    stroke-dasharray="10,5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stop A - Warehouse/Origin -->
  <circle cx="140" cy="210" r="22" fill="rgba(255,255,255,0.12)" stroke="rgba(251,191,36,0.8)" stroke-width="2"/>
  <rect x="128" y="200" width="24" height="18" rx="2" fill="rgba(251,191,36,0.5)"/>
  <polygon points="140,194 152,200 128,200" fill="rgba(251,191,36,0.7)"/>
  <text x="140" y="244" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" opacity="0.7">Almacén</text>

  <!-- Stop 1 -->
  <circle cx="240" cy="120" r="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="240" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" opacity="0.9">1</text>
  <text x="240" y="149" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.5">Parada</text>

  <!-- Stop 2 -->
  <circle cx="370" cy="180" r="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="370" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" opacity="0.9">2</text>
  <text x="370" y="209" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.5">Parada</text>

  <!-- Stop 3 -->
  <circle cx="500" cy="90" r="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="500" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" opacity="0.9">3</text>
  <text x="500" y="119" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.5">Parada</text>

  <!-- Stop D - Destination/Active delivery -->
  <circle cx="640" cy="160" r="22" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.8)" stroke-width="2"/>
  <!-- Pin icon -->
  <ellipse cx="640" cy="154" rx="10" ry="10" fill="rgba(34,197,94,0.6)"/>
  <path d="M 633 158 Q 640 172 647 158" fill="rgba(34,197,94,0.6)"/>
  <circle cx="640" cy="154" r="4" fill="rgba(255,255,255,0.8)"/>
  <text x="640" y="194" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" opacity="0.7">Entrega</text>

  <!-- Truck icon moving along route (between 2 and 3) -->
  <g transform="translate(432, 118)">
    <rect x="-22" y="-12" width="30" height="18" rx="3" fill="rgba(251,191,36,0.7)"/>
    <rect x="8" y="-8" width="14" height="14" rx="2" fill="rgba(251,191,36,0.5)"/>
    <circle cx="-12" cy="8" r="5" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="14" cy="8" r="5" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>

  <!-- Status panel (right side) -->
  <rect x="680" y="55" width="95" height="110" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="727" y="74" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.5">RUTA ACTIVA</text>
  <rect x="692" y="80" width="70" height="1" fill="rgba(255,255,255,0.1)"/>
  <!-- Status rows -->
  <circle cx="696" cy="94" r="4" fill="rgba(34,197,94,0.8)"/>
  <text x="705" y="97" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Entregados: 2</text>
  <circle cx="696" cy="110" r="4" fill="rgba(251,191,36,0.8)"/>
  <text x="705" y="113" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Pendiente: 1</text>
  <circle cx="696" cy="126" r="4" fill="rgba(148,163,184,0.5)"/>
  <text x="705" y="129" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.5">Total: 4</text>
  <rect x="692" y="138" width="70" height="1" fill="rgba(255,255,255,0.1)"/>
  <text x="727" y="152" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" opacity="0.5">75% completado</text>

  <!-- Label -->
  <text x="400" y="272" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.85" letter-spacing="3">RUTAS</text>
  <text x="400" y="290" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" opacity="0.5">Delivery Route Management</text>
</svg>
